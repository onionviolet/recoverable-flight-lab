<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
<title id="title">Recoverable Flight Lab: concept and development architecture</title>
<desc id="desc">An annotated original modular rocket concept with folding wings, compared with a proposed conventional rocket and separately tested glider. Optional turbine and drone ideas remain deferred. Not to scale or flight validated.</desc>
<defs>
 <style>text{font-family:Arial,Helvetica,sans-serif;fill:#e6edf7}.title{font-size:38px;font-weight:700}.h{font-size:23px;font-weight:700}.b{font-size:18px}.s{font-size:16px;fill:#b5c5dc}.label{font-size:15px;font-weight:700;letter-spacing:1.2px}.line{fill:none;stroke:#8296b1;stroke-width:2}.amber{fill:#f6c76a}.teal{fill:#70e0c4}</style>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8296b1"/></marker>
</defs>
<rect width="1600" height="1240" fill="#0b1220"/>
<text x="60" y="67" class="title">RECOVERABLE FLIGHT LAB</text>
<text x="60" y="102" class="b">A student project in reusable flight, deployable mechanisms, and measured engineering.</text>
<rect x="1172" y="38" width="370" height="42" rx="21" fill="#302a1c"/>
<text x="1194" y="65" class="label amber">CONCEPT • NOT FLIGHT VALIDATED</text>

<rect x="40" y="138" width="750" height="666" rx="20" fill="#142033" stroke="#33425a"/>
<text x="65" y="179" class="h">01 / Original vision</text>
<text x="65" y="208" class="s">Ideas preserved. Geometry, module count, and mass remain open.</text>

<!-- Original vehicle, top view; folded/deployed states overlaid. -->
<path d="M375 260 Q347 287 335 335 L415 335 Q403 287 375 260Z" fill="#52708f" stroke="#c4d6e9" stroke-width="2"/>
<rect x="335" y="335" width="80" height="246" rx="5" fill="#294259" stroke="#c4d6e9" stroke-width="2"/>
<rect x="335" y="592" width="80" height="88" rx="4" fill="#3d485b" stroke="#c4d6e9" stroke-width="2"/>
<path d="M350 681L345 702L405 702L400 681" fill="#253244" stroke="#c4d6e9" stroke-width="2"/>
<path d="M335 307L308 343L335 335M415 307L442 343L415 335" fill="#52708f" stroke="#c4d6e9" stroke-width="2"/>
<path d="M335 635L303 681L335 672M415 635L447 681L415 672" fill="#52708f" stroke="#c4d6e9" stroke-width="2"/>
<path d="M335 445L212 482L204 511L335 486M415 445L538 482L546 511L415 486" fill="#306b68" stroke="#70e0c4" stroke-width="2"/>
<path d="M331 450L316 351L316 486L331 486M419 450L434 351L434 486L419 486" fill="none" stroke="#70e0c4" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="335" cy="469" r="9" fill="#f6c76a"/><circle cx="415" cy="469" r="9" fill="#f6c76a"/>
<path d="M325 335H425M325 586H425" stroke="#f6c76a" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="355" y="350" width="40" height="39" rx="4" fill="#132536" stroke="#8296b1"/>
<text x="360" y="376" class="s">AV</text>

<path d="M330 293H274L254 267H81" class="line"/>
<text x="81" y="253" class="b">Nose payload</text>
<text x="81" y="291" class="s">Altimeter / other hardware</text>
<text x="81" y="314" class="s">Two fins do not prove gliding.</text>
<path d="M439 354H474L495 320H755" class="line"/>
<text x="495" y="285" class="b">Folded wing envelope</text>
<text x="495" y="309" class="s">Dashed teal = stowed idea</text>
<path d="M424 469H474L496 411H755" class="line"/>
<text x="496" y="373" class="b">Gear / axle / motor concept</text>
<text x="496" y="398" class="s">Deployment ≠ flight control</text>
<path d="M330 551H274L254 564H81" class="line"/>
<text x="81" y="552" class="b">Middle module</text>
<text x="81" y="590" class="s">Originally described as fuel.</text>
<text x="81" y="613" class="s">Could house payload / recovery.</text>
<path d="M423 587H472L496 559H755" class="line"/>
<text x="496" y="546" class="b">Possible separation interfaces</text>
<text x="496" y="584" class="s">Each piece needs recovery.</text>
<path d="M447 669H480L496 646H755" class="line"/>
<text x="496" y="631" class="b">Propulsion + aft fins</text>
<text x="496" y="669" class="s">Rocket motor or turbine:</text>
<text x="496" y="692" class="s">different architectures.</text>
<rect x="65" y="731" width="698" height="49" rx="10" fill="#253147"/>
<text x="81" y="751" class="s">ASPIRATIONAL ENVELOPE: 7–8 ft long • 1 ft body • 3–4 ft span</text>
<text x="81" y="772" class="s">Top-view schematic. Not to scale. No selected airfoil, structure, or propulsion.</text>

<rect x="810" y="138" width="750" height="666" rx="20" fill="#12282d" stroke="#35555b"/>
<text x="835" y="179" class="h">02 / Proposed development baseline</text>
<text x="835" y="208" class="s">Build independent evidence before combining the systems.</text>

<!-- Conventional rocket baseline -->
<path d="M903 250L879 302H927Z" fill="#82c8c0" stroke="#d1eee9" stroke-width="2"/>
<rect x="879" y="302" width="48" height="270" rx="3" fill="#2c6b69" stroke="#d1eee9" stroke-width="2"/>
<path d="M879 514L851 576L879 563M927 514L955 576L927 563" fill="#397c78" stroke="#d1eee9" stroke-width="2"/>
<path d="M883 384H923M883 463H923" stroke="#83b8b5" stroke-dasharray="5 4"/>
<text x="891" y="347" class="s">AV</text>
<text x="892" y="424" class="s">R</text>
<text x="891" y="530" class="s">M</text>
<path d="M930 338H982" class="line"/>
<text x="995" y="336" class="b">Instrumentation / tracking</text>
<path d="M930 416H982" class="line"/>
<text x="995" y="412" class="b">Parachute recovery</text>
<path d="M931 527H982" class="line"/>
<text x="995" y="515" class="b">Certified commercial motor</text>
<text x="995" y="540" class="s">Fixed stabilizing surfaces; size TBD</text>
<text x="837" y="613" class="label teal">C1 / CONVENTIONAL ROCKET</text>

<!-- Independent glider silhouette -->
<path d="M1369 303L1382 365L1510 406L1510 426L1380 401L1380 477L1426 494L1426 508L1369 499L1312 508L1312 494L1358 477L1358 401L1228 426L1228 406L1356 365Z" fill="#397c78" stroke="#b9ece0" stroke-width="2"/>
<text x="1231" y="566" class="label teal">C2 / SEPARATE GLIDER</text>
<text x="1231" y="590" class="s">Illustrative aircraft shape only.</text>
<text x="1231" y="613" class="s">Validate lift, stability, and descent.</text>

<rect x="835" y="649" width="700" height="129" rx="12" fill="#1e383d"/>
<text x="854" y="679" class="b">C0 / Inert folding-wing bench demonstrator</text>
<text x="854" y="708" class="s">Test packaging, movement, repeatability, and failure behavior.</text>
<text x="854" y="739" class="b">C3 / Integration is a later review decision</text>
<text x="854" y="763" class="s">Independent success does not establish safe separation or transition.</text>

<text x="60" y="852" class="h">03 / Evidence before integration</text>
<g fill="#19283c" stroke="#40516b">
<rect x="60" y="875" width="260" height="87" rx="12"/><rect x="361" y="875" width="260" height="87" rx="12"/><rect x="662" y="875" width="260" height="87" rx="12"/><rect x="963" y="875" width="260" height="87" rx="12"/><rect x="1264" y="875" width="276" height="87" rx="12"/>
</g>
<g class="line" marker-end="url(#arrow)"><path d="M324 918H352"/><path d="M625 918H653"/><path d="M926 918H954"/><path d="M1227 918H1255"/></g>
<text x="78" y="906" class="b">G0 / Scope + mentor</text><text x="78" y="937" class="s">Mission, mass, site, budget</text>
<text x="379" y="906" class="b">G1 / Models + bench</text><text x="379" y="937" class="s">Assumptions + measurements</text>
<text x="680" y="906" class="b">G2 / Independent tests</text><text x="680" y="937" class="s">Recover rocket and glider</text>
<text x="981" y="906" class="b">G3 / Integration review</text><text x="981" y="937" class="s">Interfaces + failure evidence</text>
<text x="1282" y="906" class="b">G4 / Approved experiment</text><text x="1282" y="937" class="s">Inspect, explain, assess reuse</text>

<rect x="40" y="995" width="1520" height="171" rx="18" fill="#241f24" stroke="#574b42"/>
<text x="65" y="1032" class="h amber">Optional branches • preserve the ideas, keep them outside the first build</text>
<text x="65" y="1071" class="b">JET ENGINE</text><text x="65" y="1099" class="s">Sustained aircraft mission;</text><text x="65" y="1122" class="s">not an automatic rocket upgrade.</text>
<text x="443" y="1071" class="b">DRONE PAYLOAD</text><text x="443" y="1099" class="s">Launch survival + release +</text><text x="443" y="1122" class="s">aircraft transition remain open.</text>
<text x="821" y="1071" class="b">HIGH SPEED</text><text x="821" y="1099" class="s">Separate mission trade study;</text><text x="821" y="1122" class="s">additional aerodynamic loads.</text>
<text x="1199" y="1071" class="b">SHOWCASE</text><text x="1199" y="1099" class="s">Full-size inert model + deployment</text><text x="1199" y="1122" class="s">demo + measured flight replay.</text>
<text x="60" y="1205" class="s">2026-09-08 • User vision and proposed architecture shown separately • No flight performance or safety approval implied</text>
</svg>
